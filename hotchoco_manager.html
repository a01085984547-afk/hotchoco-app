<style>
:root{
  --bg:#F7F1E3; --surface:#FFFFFF; --surface-2:#FBF6EA; --border:#E7DBC4;
  --ink:#2B2118; --ink-soft:#6E5D4C; --ink-faint:#A6947F;
  --pine:#4A2E1B; --pine-deep:#2B1810; --moss:#3E7C55; --moss-soft:#E4EFE4;
  --amber:#B97A3D; --amber-soft:#F3E3C8; --danger:#B8412F; --danger-soft:#F7E2DC;
  --warning:#C98A32; --warning-soft:#F6E9D2; --safe:#2F7D4F; --safe-soft:#E1F0E4;
  --caution:#8A7A3E; --caution-soft:#F1ECD6;
  --radius:16px; --radius-sm:10px;
  --font-display:'Fraunces',serif; --font-body:'Inter',system-ui,-apple-system,'Malgun Gothic',sans-serif;
  --shadow:0 2px 10px rgba(43,24,16,0.07),0 1px 2px rgba(43,24,16,0.07);
}
*{box-sizing:border-box;min-width:0;}
html,body{margin:0;padding:0;overflow-x:hidden;}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);-webkit-font-smoothing:antialiased;padding-bottom:env(safe-area-inset-bottom);}
#app{max-width:640px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;overflow-x:hidden;width:100%;}

.dotrow{display:flex;gap:5px;align-items:center;}
.dotrow span{width:5px;height:5px;border-radius:50%;background:currentColor;display:inline-block;}
.dotrow span:nth-child(1){opacity:.35}.dotrow span:nth-child(2){opacity:.6}.dotrow span:nth-child(3){opacity:.9}
.dotrow span:nth-child(4){opacity:.6}.dotrow span:nth-child(5){opacity:.35}

header.topbar{background:linear-gradient(160deg,var(--pine) 0%,var(--pine-deep) 100%);color:#F3EFDF;padding:16px 18px 14px;position:sticky;top:0;z-index:20;}
header.topbar .brand-plaque{background:#F7F1E3;border-radius:12px;padding:8px 14px;display:inline-block;box-shadow:0 2px 6px rgba(0,0,0,0.18);}
header.topbar .brand-logo{height:34px;display:block;}
header.topbar .sub{font-size:12px;color:#D9C7B3;margin-top:9px;font-weight:500;}
header.topbar .dotrow{color:#D9A441;margin-top:10px;}
.tabstrip{display:flex;gap:4px;overflow-x:auto;margin-top:14px;-ms-overflow-style:none;scrollbar-width:none;padding-bottom:2px;}
.tabstrip::-webkit-scrollbar{display:none;}
.tabbtn{flex:0 0 auto;background:rgba(255,255,255,0.07);color:#D8E0CF;border:1px solid rgba(255,255,255,0.10);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;font-family:var(--font-body);cursor:pointer;white-space:nowrap;}
.tabbtn.active{background:#D9A441;color:#1F2914;border-color:#D9A441;}

main{padding:16px 16px 100px;}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:4px 0 12px;}
.section-head h2{font-family:var(--font-display);font-size:19px;font-weight:600;margin:0;color:var(--pine-deep);}
.section-head .count{font-size:12px;color:var(--ink-faint);font-weight:600;}
.section-sub{font-size:12.5px;color:var(--ink-soft);line-height:1.6;margin:-6px 0 14px;}

.searchbar{display:flex;gap:8px;margin-bottom:14px;}
.searchbar input{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:10px 12px;font-size:14px;font-family:var(--font-body);color:var(--ink);}
.searchbar input:focus{outline:2px solid var(--moss);outline-offset:-1px;}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow);cursor:pointer;}
.card:active{background:var(--surface-2);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.card-title{font-family:var(--font-display);font-weight:600;font-size:16.5px;color:var(--ink);}
.card-id{font-size:11px;color:var(--ink-faint);font-weight:500;margin-top:1px;}
.card-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--moss-soft);color:var(--moss);}
.chip.alt{background:var(--amber-soft);color:var(--amber);}
.chip.muted{background:#EEEBDF;color:var(--ink-soft);}
.chip.danger{background:var(--danger-soft);color:var(--danger);}
.card-sub{font-size:12.5px;color:var(--ink-soft);margin-top:8px;line-height:1.5;}
.card-datarow{display:flex;justify-content:space-between;margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);}
.card-datarow .dcell{text-align:left;}
.card-datarow .dcell .lbl{font-size:10.5px;color:var(--ink-faint);font-weight:600;}
.card-datarow .dcell .val{font-family:var(--font-display);font-size:14px;font-weight:600;color:var(--pine-deep);margin-top:2px;}

.empty-state{text-align:center;padding:50px 20px;color:var(--ink-faint);}
.empty-state .dotrow{justify-content:center;color:var(--amber);margin-bottom:14px;}
.empty-state p{font-size:13.5px;line-height:1.6;margin:0;}

.stat-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-bottom:18px;}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;box-shadow:var(--shadow);}
.stat-card .num{font-family:var(--font-display);font-size:26px;font-weight:600;color:var(--pine-deep);}
.stat-card .lbl{font-size:12px;color:var(--ink-soft);margin-top:2px;font-weight:500;}
.alert-card{border-radius:var(--radius);padding:13px 15px;margin-bottom:10px;border:1px solid;display:flex;gap:10px;align-items:flex-start;}
.alert-card.danger{background:var(--danger-soft);border-color:#E9C4B8;color:#7A2C1F;}
.alert-card.warning{background:var(--warning-soft);border-color:#E9D3A8;color:#6B4A17;}
.alert-card.safe{background:var(--safe-soft);border-color:#BFE0CA;color:#1E5C38;}
.alert-card .icon{font-size:16px;line-height:1.4;}
.alert-card .body b{display:block;font-size:13.5px;margin-bottom:2px;}
.alert-card .body span{font-size:12.5px;opacity:.9;}

.fab{position:fixed;bottom:24px;right:calc(50% - 320px + 20px);width:54px;height:54px;border-radius:50%;background:var(--pine);color:#F3EFDF;border:none;font-size:26px;box-shadow:0 6px 18px rgba(18,41,27,0.35);cursor:pointer;z-index:15;display:flex;align-items:center;justify-content:center;line-height:0;}
@media (max-width:680px){.fab{right:20px;}}

.modal-overlay{position:fixed;inset:0;background:rgba(18,29,20,0.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;}
.modal{background:var(--surface);width:100%;max-width:640px;border-radius:20px 20px 0 0;max-height:92vh;overflow-y:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom));animation:slideup .18s ease-out;}
@keyframes slideup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;position:sticky;top:0;background:var(--surface);padding-bottom:4px;}
.modal-head h3{font-family:var(--font-display);font-size:18px;margin:0;color:var(--pine-deep);}
.modal-close{background:none;border:none;font-size:22px;color:var(--ink-faint);cursor:pointer;padding:4px;line-height:1;}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px;}
.field.full{grid-column:1/-1;}
.field span{font-size:12.5px;font-weight:600;color:var(--ink-soft);}
.field input,.field select,.field textarea{border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 11px;font-size:14.5px;font-family:var(--font-body);color:var(--ink);background:var(--surface-2);}
.field textarea{min-height:64px;resize:vertical;font-family:var(--font-body);}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--moss);outline-offset:-1px;}
.form-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 10px;min-width:0;}
.form-divider{font-size:12px;font-weight:700;color:var(--amber);text-transform:uppercase;letter-spacing:.05em;margin:16px 0 8px;display:flex;align-items:center;gap:8px;}
.form-divider::after{content:'';flex:1;height:1px;background:var(--border);}
.modal-actions{display:flex;gap:8px;margin-top:18px;}
.btn{border:none;border-radius:var(--radius-sm);padding:12px 16px;font-size:14.5px;font-weight:700;cursor:pointer;font-family:var(--font-body);}
.btn-primary{background:var(--pine);color:#F3EFDF;flex:1;}
.btn-danger{background:var(--danger-soft);color:var(--danger);}
.btn-ghost{background:var(--surface-2);color:var(--ink-soft);border:1px solid var(--border);}
.btn-block{width:100%;}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:999px;}
.readonly-note{font-size:11.5px;color:var(--ink-faint);margin:-3px 0 10px;}
.photo-row{display:flex;gap:10px;flex-wrap:wrap;}
.photo-thumb-wrap{position:relative;width:72px;height:72px;}
.photo-thumb{width:72px;height:72px;object-fit:cover;border-radius:12px;border:2px solid var(--border);display:block;}
.photo-thumb.is-primary{border-color:var(--amber);}
.photo-star{position:absolute;top:-7px;left:-7px;width:22px;height:22px;border-radius:50%;border:none;background:#fff;color:var(--ink-faint);font-size:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);line-height:1;padding:0;}
.photo-star.active{background:var(--amber);color:#fff;}
.photo-remove{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:none;background:var(--danger);color:#fff;font-size:12px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.2);line-height:1;padding:0;}
.photo-add{width:72px;height:72px;border:2px dashed var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-faint);font-size:24px;font-weight:300;}
.card-avatar{width:44px;height:44px;border-radius:50%;object-fit:cover;border:1px solid var(--border);flex:0 0 auto;}
.card-avatar-placeholder{width:44px;height:44px;border-radius:50%;background:var(--surface-2);border:1px solid var(--border);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:18px;}
.chip-group{display:flex;flex-wrap:wrap;gap:6px;}
.chip-toggle{border:1px solid var(--border);background:var(--surface-2);color:var(--ink-soft);font-size:12px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;font-family:var(--font-body);}
.chip-toggle.chip-selected{background:var(--moss);border-color:var(--moss);color:#fff;}
.chipgroup-wrap{margin-bottom:11px;}
.chipgroup-toggle{width:100%;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border);background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 12px;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:var(--font-body);}
.chipgroup-toggle .chevron{color:var(--ink-faint);font-size:11px;}
.chipgroup-panel{padding:10px 2px 2px;}

.bloodline-banner{border-radius:var(--radius-sm);padding:12px 13px;margin:6px 0 14px;border:1px solid;font-size:13px;line-height:1.55;}
.bloodline-banner.danger{background:var(--danger-soft);border-color:#E9C4B8;color:#7A2C1F;}
.bloodline-banner.warning{background:var(--warning-soft);border-color:#E9D3A8;color:#6B4A17;}
.bloodline-banner.caution{background:var(--caution-soft);border-color:#DFD5A6;color:#5C5324;}
.bloodline-banner.safe{background:var(--safe-soft);border-color:#BFE0CA;color:#1E5C38;}
.bloodline-banner b{display:block;margin-bottom:3px;font-size:13.5px;}
.bloodline-banner ul{margin:6px 0 0;padding-left:18px;}

.pc-select-row{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-bottom:14px;}
.pc-select-row .vs{font-family:var(--font-display);font-weight:600;color:var(--amber);font-size:13px;text-align:center;}
.tree-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 13px;font-size:12.5px;color:var(--ink-soft);margin-top:10px;line-height:1.7;}
.tree-box b{color:var(--ink);}
.disclaimer{font-size:11.5px;color:var(--ink-faint);line-height:1.6;margin-top:16px;background:var(--surface-2);border-radius:var(--radius-sm);padding:11px 13px;border:1px solid var(--border);}
.badge-link{display:inline-block;margin-top:8px;font-size:12px;font-weight:700;color:var(--moss);background:var(--moss-soft);padding:5px 10px;border-radius:999px;}

/* ---------- mating card (accordion) ---------- */
.mating-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;box-shadow:var(--shadow);overflow:hidden;}
.mating-head{padding:14px 15px;cursor:pointer;}
.mating-head .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.mating-actions{display:flex;gap:6px;margin-top:10px;}
.mating-detail{border-top:1px solid var(--border);background:var(--surface-2);padding:12px 15px 15px;}
.clutch-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);font-size:12.5px;}
.clutch-row:last-child{border-bottom:none;}
.clutch-row .cnum{font-family:var(--font-display);font-weight:600;color:var(--pine-deep);width:34px;flex:0 0 auto;}
.clutch-row .cmid{flex:1;color:var(--ink-soft);}
.clutch-row .cright{text-align:right;font-weight:600;color:var(--ink);}
.egg-mini{display:inline-flex;gap:3px;}
.egg-mini .dot{width:9px;height:9px;border-radius:50%;}
.egg-mini .dot.fertile{background:var(--moss);}
.egg-mini .dot.infertile{background:#D8D2BE;}
.mating-log{font-size:11.5px;color:var(--ink-faint);margin-top:10px;}

/* ---------- egg counter grid ---------- */
.egg-group{margin-bottom:22px;}
.egg-group-head{font-family:var(--font-display);font-weight:600;font-size:15px;color:var(--pine-deep);margin-bottom:2px;}
.egg-group-sub{font-size:11.5px;color:var(--ink-faint);margin-bottom:10px;}
.egg-row{display:flex;gap:14px;flex-wrap:wrap;row-gap:20px;}
.egg{width:56px;height:70px;border-radius:50% 50% 46% 46% / 58% 58% 42% 42%;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;box-shadow:0 3px 8px rgba(18,41,27,0.12);}
.egg .cnum-badge{position:absolute;top:-9px;left:50%;transform:translateX(-50%);background:var(--pine);color:#F3EFDF;font-size:8.5px;font-weight:700;padding:1px 6px;border-radius:8px;white-space:nowrap;}
.egg.fertile{background:linear-gradient(160deg,#F6E9D2 0%,#EAD3A0 100%);border:1px solid #DDBE7C;}
.egg.hatched{background:linear-gradient(160deg,#E1F0E4 0%,#BFE0CA 100%);border:1px solid #9CC9A6;}
.egg.hatched .num{color:#1E5C38;}
.egg.hatched .lbl{color:#2F7D4F;}
.egg.infertile{background:#EAE6D6;border:1px solid #D8D2BE;opacity:.7;}
.egg.overdue{background:linear-gradient(160deg,#F7E2DC 0%,#EFC3B6 100%);border:1px solid #E0A390;}
.egg .num{font-family:var(--font-display);font-weight:700;font-size:19px;color:#6B4A17;}
.egg.overdue .num{color:#7A2C1F;}
.egg .lbl{font-size:8.5px;font-weight:700;color:#8A7A3E;margin-top:1px;}
.egg.infertile .lbl{color:var(--ink-faint);}
.hatched-list-item{display:flex;justify-content:space-between;padding:9px 12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);margin-bottom:7px;font-size:12.5px;}
.hatched-list-item .l{color:var(--ink-soft);}
.hatched-list-item .r{font-weight:700;color:var(--moss);}

.temp-table{width:100%;border-collapse:collapse;margin-top:8px;font-size:11.5px;}
.temp-table th,.temp-table td{padding:6px 5px;text-align:center;border-bottom:1px solid var(--border);}
.temp-table th{color:var(--ink-faint);font-weight:700;font-size:10.5px;}
.temp-table tr.user-row td{background:var(--amber-soft);font-weight:700;color:#6B4A17;}
</style>
</head>

/* ---------------- helpers ---------------- */
function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function fmtMoney(n){
  if(n===null||n===undefined||n==='') return '';
  return Number(n).toLocaleString('ko-KR')+'원';
}
function todayISO(){ return new Date().toISOString().slice(0,10); }
function addDays(dateStr, days){
  if(!dateStr || days===null || days===undefined || isNaN(days)) return null;
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+Math.round(days));
  return d.toISOString().slice(0,10);
}
function daysBetween(a,b){
  return Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
}
function fmtKo(dateStr){
  if(!dateStr) return '-';
  const d = new Date(dateStr+'T00:00:00');
  return `${d.getMonth()+1}/${d.getDate()}`;
}
function nextEntityId(prefix, list, pad){
  let max = 0;
  list.forEach(item=>{
    if(item.id && item.id.startsWith(prefix)){
      const n = parseInt(item.id.slice(prefix.length),10);
      if(!isNaN(n) && n>max) max = n;
    }
  });
  return prefix+String(max+1).padStart(pad,'0');
}

const INCUBATION_TABLE = [
  {temp:20.0, min:104, max:130, avg:117, source:'chart'},

];
const MIN_SAFE_TEMP = 20.0;
const MAX_SAFE_TEMP = 26.7;
const DEFAULT_INCUBATION_TEMP = 24;
const DEFAULT_CYCLE_DAYS = 30;

function interpolateField(temp, field){
  const pts = INCUBATION_TABLE.filter(t=>t[field]!==null).sort((a,b)=>a.temp-b.temp);
  if(pts.length===0) return null;
  const exact = pts.find(p=>Math.abs(p.temp-temp)<0.001);
  if(exact) return exact[field];
  if(temp <= pts[0].temp) return pts[0][field];
  if(temp >= pts[pts.length-1].temp) return pts[pts.length-1][field];
  for(let i=0;i<pts.length-1;i++){
    const a = pts[i], b = pts[i+1];
    if(temp>=a.temp && temp<=b.temp){
      const frac = (temp-a.temp)/(b.temp-a.temp);
      return a[field] + frac*(b[field]-a[field]);
    }
  }
  return null;
}
function predictHatchDays(temp){
  const t = parseFloat(temp);
  if(isNaN(t)) return {danger:false, min:null, max:null, avg:null};
  return {
    danger: t<MIN_SAFE_TEMP || t>MAX_SAFE_TEMP,
    min: interpolateField(t,'min'), max: interpolateField(t,'max'), avg: interpolateField(t,'avg')
  };
}
function predictHatchDates(layDate, temp){
  const p = predictHatchDays(temp);
  return {
    ...p,
    minDate: p.min!==null ? addDays(layDate, p.min) : null,
    maxDate: p.max!==null ? addDays(layDate, p.max) : null,
    avgDate: p.avg!==null ? addDays(layDate, p.avg) : null
  };
}

    status:r['현재 상태']||'보유', memo:r['메모']||''
  }));
  const matings = (raw['페어링관리']||[]).filter(r=>r['페어링 ID']).map(r=>({
    id:r['페어링 ID'], damId:r['암컷 ID']||'', damName:r['암컷 이름']||'',
    sireId:r['수컷 ID']||'', sireName:r['수컷 이름']||'',
    matingLog: r['시작일'] ? [r['시작일']] : [],
    status:r['상태']||'진행 중', seasonEndDate:'',
    cycleDays: DEFAULT_CYCLE_DAYS, incubationTemp: DEFAULT_INCUBATION_TEMP
  }));
  const clutches = (raw['산란알관리']||[]).filter(r=>r['클러치 ID']).map(r=>({
    id:r['클러치 ID'], matingId:(r['페어링 ID']||''),
    damId:r['암컷 ID']||'', damName:r['암컷 이름']||'',

    clutchNum:r['산란 차수']||'', layDate:r['산란일']||'',
    egg1Status:r['알1 상태']||'', egg2Status:r['알2 상태']||'',
    incubationTemp: DEFAULT_INCUBATION_TEMP,
    actualHatchCount:r['실제 해칭 수'], failCount:r['부화 실패 수'], note:r['특이사항']||''
  }));
  const hatchlings = (raw['해칭개체']||[]).filter(r=>r['해칭 개체 ID']).map(r=>({
    id:r['해칭 개체 ID'], clutchId:r['클러치 ID']||'', eggLabel:r['알 번호']||'',
    layDate:r['산란일']||'', hatchDate:r['해칭일']||'', incubationDays:r['인큐베이션 일수'],
    damId:r['모 ID']||'', damName:r['모 이름']||'', sireId:r['부 ID']||'', sireName:r['부 이름']||'',
    morph:r['확정 모프']||'', gender:r['성별']||'미구분', dotStatus:r['점 여부']||'',
    keep:r['킵 여부']||'', breeding:r['브리딩 여부']||'', main:r['메인 여부']||'',

  }));
  return { individuals, matings, clutches, hatchlings };
}

/* ---------------- 레거시 모프 코드(Ax, LwHAx 등) → 새 모프/헷 체계 자동 변환 ---------------- */
const LEGACY_MORPH_MAP = {
  'Ax':      {morph:'아잔틱', het:''},
  'LwHAx':   {morph:'릴리화이트', het:'헷아잔틱'},
  'LwAx':    {morph:'릴잔틱', het:''},
  'NHAx':    {morph:'노멀', het:'헷아잔틱'},
  'Normal':  {morph:'노멀', het:''}
};
function migrateLegacyMorphs(st){
  let changed = false;
  function applyPair(target, morphField, hetField){
    const mapped = LEGACY_MORPH_MAP[target[morphField]];
    if(mapped){
      target[morphField] = mapped.morph;
      target[hetField] = mapped.het;
      changed = true;
    }
  }
  (st.individuals||[]).forEach(i=>{
    applyPair(i,'morph','morphHet');
    applyPair(i,'sireMorph','sireHet');
    applyPair(i,'damMorph','damHet');
  });
  (st.hatchlings||[]).forEach(h=>{
    applyPair(h,'morph','morphHet');
  });
  return changed;
}

/* ---------------- 개체 ID: 성별 기반 (수컷 M / 암컷 F / 미구분 U) ---------------- */
function genderIdPrefix(gender){
  if(gender==='수컷') return 'HCC-M-';
  if(gender==='암컷') return 'HCC-F-';
  return 'HCC-U-';
}

/* 예전 HCC-E-xxxx 개체 ID를 성별 기반 ID로 일괄 전환하고, 다른 곳에서의 참조(부모ID, 메이팅/클러치/해칭개체의 dam/sireId, 승급연결)까지 전부 갱신한다. */
/* idMap = {기존ID: 새ID} 형태를 받아서, 이 개체를 참조하는 모든 곳(부모연결/메이팅/클러치/해칭개체)을 함께 갱신한다. */
function applyIndividualIdMap(st, idMap){
  (st.individuals||[]).forEach(ind=>{
    if(idMap[ind.id]) ind.id = idMap[ind.id];
    if(ind.sireId && idMap[ind.sireId]) ind.sireId = idMap[ind.sireId];
    if(ind.damId && idMap[ind.damId]) ind.damId = idMap[ind.damId];
  });
  (st.matings||[]).forEach(m=>{
    if(m.damId && idMap[m.damId]) m.damId = idMap[m.damId];
    if(m.sireId && idMap[m.sireId]) m.sireId = idMap[m.sireId];
  });
  (st.clutches||[]).forEach(c=>{
    if(c.damId && idMap[c.damId]) c.damId = idMap[c.damId];
    if(c.sireId && idMap[c.sireId]) c.sireId = idMap[c.sireId];
  });
  (st.hatchlings||[]).forEach(h=>{
    if(h.damId && idMap[h.damId]) h.damId = idMap[h.damId];
    if(h.sireId && idMap[h.sireId]) h.sireId = idMap[h.sireId];
    if(h.promotedToId && idMap[h.promotedToId]) h.promotedToId = idMap[h.promotedToId];
  });
}

function migrateIndividualIdsToGenderPrefix(st){
  const needsMigration = (st.individuals||[]).some(i=>i.id && i.id.startsWith('HCC-E-'));
  if(!needsMigration) return false;
  const idMap = {};
  const counters = {};
  st.individuals.slice().sort((a,b)=>(a.id||'').localeCompare(b.id||'')).forEach(ind=>{
    if(!ind.id || !ind.id.startsWith('HCC-E-')) return;
    const prefix = genderIdPrefix(ind.gender);
    counters[prefix] = (counters[prefix]||0)+1;
    idMap[ind.id] = prefix + String(counters[prefix]).padStart(4,'0');
  });
  if(Object.keys(idMap).length===0) return false;
  applyIndividualIdMap(st, idMap);
  return true;
}

/* 개체 ID의 성별 접두사(HCC-M-/HCC-F-/HCC-U-)를 반환 */
function idGenderPrefixOf(id){
  const m = id && id.match(/^HCC-[A-Z]+-/);
  return m ? m[0] : null;
}

/* 성별을 나중에 고쳤을 때, ID만 안전하게 재발급(모든 참조 자동 갱신). 삭제/재등록할 필요 없음. */
async function reissueIndividualId(oldId){
  const ind = state.individuals.find(i=>i.id===oldId);
  if(!ind) return;
  const correctPrefix = genderIdPrefix(ind.gender);
  if(idGenderPrefixOf(oldId)===correctPrefix){
    alert('이미 현재 성별에 맞는 ID예요.');
    return;
  }
  const newId = nextEntityId(correctPrefix, state.individuals, 4);
  if(!confirm(`ID를 ${oldId} → ${newId}(으)로 바꿀까요?\n이 개체를 참조하는 부모 연결·메이팅·클러치·해칭개체 기록이 전부 자동으로 함께 갱신돼요.`)) return;
  applyIndividualIdMap(state, { [oldId]: newId });
  closeModal();
  await persistAndRender();
  openIndividualForm(newId);
}

/* ---------------- storage ---------------- */
/* 저장소: Claude 아티팩트 환경(window.storage)에서 열었을 때는 그걸 쓰고,
   폰에 설치해서 독립 실행할 때는 브라우저 localStorage로 자동 전환된다. */
async function storageGet(key){
  if(typeof window.storage!=='undefined' && window.storage){
    try{
      const res = await window.storage.get(key, false);
      if(res && res.value) return res.value;
      return null;
    }catch(e){ /* fall through to localStorage */ }
  }
  try{
    return localStorage.getItem(key);
  }catch(e){ return null; }
}
async function storageSet(key, value){
  if(typeof window.storage!=='undefined' && window.storage){
    try{ await window.storage.set(key, value, false); return; }
    catch(e){ /* fall through to localStorage */ }
  }
  try{ localStorage.setItem(key, value); }
  catch(e){ console.error('저장 실패', e); }
}

async function loadState(){
  const raw = await storageGet(STORAGE_KEY);
  if(raw){ try{ state = JSON.parse(raw); }catch(e){ state = null; } }
  let fromSeed = false;
  if(!state){
    const seedRaw = JSON.parse(document.getElementById('seed-data').textContent);
    state = transformSeed(seedRaw);
    fromSeed = true;
  }
  const migratedMorphs = migrateLegacyMorphs(state);
  const migratedIds = migrateIndividualIdsToGenderPrefix(state);
  const migratedSaleLabel = migrateSaleStatusLabel(state);
  if(fromSeed || migratedMorphs || migratedIds || migratedSaleLabel){ await saveState(); }
}
async function saveState(){
  await storageSet(STORAGE_KEY, JSON.stringify(state));
  if(firestoreDb){ await pushStateToCloud(); }
}
async function persistAndRender(){ await saveState(); render(); }

/* ---------------- 메이팅 파생 계산 ---------------- */
function clutchesOfMating(matingId){
  return state.clutches.filter(c=>c.matingId===matingId).sort((a,b)=>(a.layDate||'').localeCompare(b.layDate||''));
}
function latestMatingDate(mating){
  if(!mating.matingLog || mating.matingLog.length===0) return null;
  return mating.matingLog.slice().sort().slice(-1)[0];
}
function nextClutchNum(mating){
  const cs = clutchesOfMating(mating.id);
  return cs.length+1;
}
function nextLayPrediction(mating){
  if(normalizeMatingStatus(mating.status)==='산란 종료') return null;
  const cs = clutchesOfMating(mating.id);
  if(cs.length===0) return null;
  const last = cs[cs.length-1];
  if(!last.layDate) return null;
  const cycle = mating.cycleDays || DEFAULT_CYCLE_DAYS;
  return addDays(last.layDate, cycle);
}

/* 메이팅 카드용 D-day 정보: 클러치가 있으면 예정일 대비 D-day, 없으면 최근 메이팅일 대비 경과일(D+) */
function matingDdayInfo(mating){
  if(normalizeMatingStatus(mating.status)==='산란 종료') return {mode:'ended'};
  const cs = clutchesOfMating(mating.id);
  if(cs.length===0){
    const last = latestMatingDate(mating);
    if(!last) return {mode:'none'};
    const elapsed = daysBetween(last, todayISO());
    return {mode:'waiting', elapsed};
  }
  const nextDate = nextLayPrediction(mating);
  if(!nextDate) return {mode:'none'};
  const diff = daysBetween(todayISO(), nextDate); // 양수면 D-diff, 음수면 D+
  return {mode:'predicted', date:nextDate, diff};
}
function formatDday(diff){
  if(diff>0) return `D-${diff}`;
  if(diff<0) return `D+${Math.abs(diff)}`;
  return 'D-day';
}

/* ---------------- 메이팅 상태: 진행 중 / 산란 종료 두 가지로 단순화 ---------------- */
function normalizeMatingStatus(status){
  if(status==='산란 종료' || status==='완료' || status==='중단') return '산란 종료';
  return '진행 중'; // '진행 중', '수컷 교체 예정' 등은 모두 진행 중으로 취급
}
async function toggleMatingStatus(matingId){
  const m = state.matings.find(x=>x.id===matingId);
  if(!m) return;
  m.status = normalizeMatingStatus(m.status)==='진행 중' ? '산란 종료' : '진행 중';
  await persistAndRender();
}

/* ---------------- 패턴/컬러 다중 선택 칩 ---------------- */
let multiSelectState = {};
function renderChipGroupInner(stateKey, options){
  const sel = multiSelectState[stateKey] || new Set();
  return options.map(o=>`<button type="button" class="chip-toggle ${sel.has(o)?'chip-selected':''}" onclick="toggleChip(this,'${stateKey}','${esc(o)}')">${esc(o)}</button>`).join('');
}
function buildChipGroupHtml(stateKey, options, currentArray){
  multiSelectState[stateKey] = new Set(currentArray||[]);
  return `<div class="chip-group" id="${stateKey}ChipGroup">${renderChipGroupInner(stateKey, options)}</div>`;
}
function toggleChip(el, stateKey, value){
  el.classList.toggle('chip-selected');
  if(!multiSelectState[stateKey]) multiSelectState[stateKey] = new Set();
  if(multiSelectState[stateKey].has(value)) multiSelectState[stateKey].delete(value);
  else multiSelectState[stateKey].add(value);
  updateChipGroupSummary(stateKey);
}
function readChipGroup(stateKey){
  return multiSelectState[stateKey] ? Array.from(multiSelectState[stateKey]) : [];
}
function setChipGroupValue(stateKey, arr, options){
  multiSelectState[stateKey] = new Set(arr||[]);
  const container = document.getElementById(stateKey+'ChipGroup');
  if(container) container.innerHTML = renderChipGroupInner(stateKey, options);
  updateChipGroupSummary(stateKey);
  const panel = document.getElementById(stateKey+'Panel');
  const chevron = document.getElementById(stateKey+'Chevron');
  if(panel){
    const hasSelection = (arr||[]).length>0;
    panel.style.display = hasSelection ? 'block' : 'none';
    if(chevron) chevron.textContent = hasSelection ? '▴' : '▾';
  }
}
function updateChipGroupSummary(stateKey){
  const summaryEl = document.getElementById(stateKey+'Summary');
  if(!summaryEl) return;
  const label = summaryEl.getAttribute('data-label') || '';
  const count = multiSelectState[stateKey] ? multiSelectState[stateKey].size : 0;
  summaryEl.textContent = count>0 ? `${label} · ${count}개 선택됨` : `${label} 선택 안 함 (누르면 선택)`;
}
function toggleChipGroupPanel(stateKey){
  const panel = document.getElementById(stateKey+'Panel');
  const chevron = document.getElementById(stateKey+'Chevron');
  if(!panel) return;
  const isOpen = panel.style.display !== 'none';
  panel.style.display = isOpen ? 'none' : 'block';
  if(chevron) chevron.textContent = isOpen ? '▾' : '▴';
}
function buildCollapsibleChipGroup(stateKey, label, options, currentArray){
  const hasSelection = currentArray && currentArray.length>0;
  const chipHtml = buildChipGroupHtml(stateKey, options, currentArray);
  const summaryText = hasSelection ? `${label} · ${currentArray.length}개 선택됨` : `${label} 선택 안 함 (누르면 선택)`;
  return `<div class="chipgroup-wrap">
    <button type="button" class="chipgroup-toggle" onclick="toggleChipGroupPanel('${stateKey}')">
      <span id="${stateKey}Summary" data-label="${esc(label)}">${esc(summaryText)}</span>
      <span class="chevron" id="${stateKey}Chevron">${hasSelection?'▴':'▾'}</span>
    </button>
    <div class="chipgroup-panel" id="${stateKey}Panel" style="display:${hasSelection?'block':'none'};">
      ${chipHtml}
    </div>
  </div>`;
}

/* 표시용: "헷아잔틱" → "Het 아잔틱" */
function formatHetDisplay(hetValue){
  if(!hetValue) return '';
  const trait = hetValue.startsWith('헷') ? hetValue.slice(1) : hetValue;
  return `Het ${trait}`;
}
function formatMorphFull(morph, het, patterns, colors){
  const parts = [];
  if(morph) parts.push(morph);
  if(het) parts.push(formatHetDisplay(het));
  const tags = [...(patterns||[]), ...(colors||[])];
  return { main: parts.join(' '), tags };
}
function formatMorphDisplayFull(morph, het, patterns, colors){
  const { main, tags } = formatMorphFull(morph, het, patterns, colors);
  return [main, ...tags].filter(Boolean).join(', ');
}

function hatchlingForEgg(clutchId, eggLabel){

function avgIncubationTemp(){
  const vals = state.clutches.map(c=>parseFloat(c.incubationTemp)).filter(v=>!isNaN(v));
  if(vals.length===0) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}
function avgActualIncubationDays(){
  const vals = state.hatchlings.map(h=>parseFloat(h.incubationDays)).filter(v=>!isNaN(v));
  if(vals.length===0) return null;
  return vals.reduce((a,b)=>a+b,0)/vals.length;
}

/* =====================================================================
   혈통(근친) 체크 엔진
   - 개체/해칭개체 모두 sireId·damId(연결) 또는 sireName/damName(이름만)
     정보를 가질 수 있음. ID로 연결된 조상은 계속 거슬러 올라가고,
     이름만 있는 조상은 그 지점에서 멈춘다(더 위 세대는 알 수 없음).
   - 이름만 있는 조상이라도 "이름+출신업체"가 같으면 동일 개체로 간주해
     겹침을 잡아낸다.
===================================================================== */

function getEntityById(compositeId){
  // compositeId: "IND:xxx" or "HAT:xxx" or plain individual id
  if(compositeId.startsWith('IND:')) compositeId = compositeId.slice(4);
  if(compositeId.startsWith('HAT:')){
    const id = compositeId.slice(4);
    return state.hatchlings.find(h=>h.id===id) || null;
  }
  return state.individuals.find(i=>i.id===compositeId) || null;
}

function parentRef(entity, side){
  // side: 'sire' or 'dam'
  const idKey = side+'Id', nameKey = side+'Name', coKey = side+'Company';
  if(entity[idKey]){
    return { type:'linked', id: entity[idKey] };
  }
  if(entity[nameKey]){
    return { type:'named', key: (entity[nameKey]||'').trim()+'|'+((entity[coKey]||'').trim()) };
  }
  return null;
}

function buildAncestryMap(startEntity, maxGen){
  maxGen = maxGen || 6;
  const visited = new Map(); // key -> {gen, label, linkedId, branch}
  const queue = [{ent:startEntity, gen:0, branch:null}];
  const seenEnt = new Set();
  while(queue.length){
    const {ent, gen, branch} = queue.shift();
    if(gen>=maxGen) continue;
    ['sire','dam'].forEach(side=>{
      const ref = parentRef(ent, side);
      if(!ref) return;
      const key = ref.type==='linked' ? ('ID:'+ref.id) : ('NAME:'+ref.key);
      const newGen = gen+1;
      const newBranch = branch===null ? side : branch; // 1대에서 정해진 쪽(부/모)을 그대로 물려받음
      const label = ent[side+'Name'] || (ref.type==='linked' ? ((state.individuals.find(i=>i.id===ref.id)||{}).name||'?') : '이름 미상');
      const existing = visited.get(key);
      if(!existing || existing.gen>newGen){
        visited.set(key, {gen:newGen, label, linkedId: ref.type==='linked'?ref.id:null, branch:newBranch});
      }
      if(ref.type==='linked' && !seenEnt.has('ID:'+ref.id+':'+newGen)){
        const nextInd = state.individuals.find(i=>i.id===ref.id);
        if(nextInd){
          seenEnt.add('ID:'+ref.id+':'+newGen);
          queue.push({ent:nextInd, gen:newGen, branch:newBranch});
        }
      }
    });
  }
  return visited;
}

/* 세대수 + 부/모 쪽을 한국어 호칭으로: 1대=부/모, 2대=조부모/외조부모, 3대=증조부모/외증조부모, 4대 이상은 구체적 호칭 없이 "N대 위 조상" */
function kinshipLabel(gen, branch){
  if(gen===1) return branch==='sire' ? '부' : '모';
  if(gen===2) return branch==='sire' ? '조부모' : '외조부모';
  if(gen===3) return branch==='sire' ? '증조부모' : '외증조부모';
  return `${gen}대 위 조상`;
}

function entityKeyOf(ent){
  return 'ID:'+ent.id;
}

function compareBloodline(entA, entB){
  if(!entA || !entB) return null;
  if(entA===entB || (entA.id && entB.id && entA.id===entB.id && entA.name!==undefined && entB.name!==undefined)){
    // same individual object reference check by id only meaningful for individuals
  }
  if(entA.id===entB.id){
    return { level:'danger', title:'동일 개체', detail:'같은 개체를 선택했습니다.', common:[] };
  }
  const mapA = buildAncestryMap(entA);
  const mapB = buildAncestryMap(entB);
  const keyA = entityKeyOf(entA), keyB = entityKeyOf(entB);

  // direct ancestor relation
  if(mapB.has(keyA)){
    const g = mapB.get(keyA).gen;
    return {
      level:'danger',
      title: g===1 ? '부모-자식 관계' : (g===2 ? '조부모-손주 관계' : `직계 조상 관계 (${g}대)`),
      detail:`${entA.name||entA.id}(이)가 ${entB.name||entB.id}의 ${g}대 위 직계 조상입니다. 페어링을 피해주세요.`,
      common:[]
    };
  }
  if(mapA.has(keyB)){
    const g = mapA.get(keyB).gen;
    return {
      level:'danger',
      title: g===1 ? '부모-자식 관계' : (g===2 ? '조부모-손주 관계' : `직계 조상 관계 (${g}대)`),
      detail:`${entB.name||entB.id}(이)가 ${entA.name||entA.id}의 ${g}대 위 직계 조상입니다. 페어링을 피해주세요.`,
      common:[]
    };
  }

  const common = [];
  mapA.forEach((infoA, key)=>{
    if(mapB.has(key)){
      const infoB = mapB.get(key);
      common.push({ key, label:infoA.label, genA:infoA.gen, genB:infoB.gen, branchA:infoA.branch, branchB:infoB.branch });
    }
  });

  if(common.length===0){
    return {
      level:'safe',
      title:'확인된 계보 내 공통 조상 없음',
      detail:'등록된 혈통 정보 범위 안에서는 겹치는 조상이 발견되지 않았습니다.',
      common:[]
    };
  }

  const sameParents = common.filter(c=>c.genA===1 && c.genB===1);
  // F-등급: 공통 조상 하나당 min(genA,genB)를 그 조상까지의 '세대'로 보고,
  // 여러 공통 조상 중 가장 가까운(작은) 값을 전체 근친도로 사용한다.
  // 규칙: F1·F2(부모/조부모 공통 포함 2대 이내) = 절대 불가, F3 = 주의, F4 이상 = 안전.
  const fLevel = Math.min(...common.map(c=>Math.min(c.genA, c.genB)));
  let level, title, detail;
  if(sameParents.length>=2){
    level='danger'; title='완전 형제자매(친남매) — F1';
    detail='양쪽 부모가 모두 같습니다(F1). 절대 페어링하지 마세요.';
  } else if(sameParents.length===1){
    level='danger'; title='이복/이부 형제자매 — F1';
    detail=`부모 중 한쪽(${sameParents[0].label})이 같습니다(F1). 절대 페어링하지 마세요.`;
  } else if(fLevel<=2){
    level='danger'; title=`근친 위험 — F${fLevel}`;
    detail=`공통 조상까지 ${fLevel}대 이내로 가깝습니다(F1~F2급). 절대 페어링하지 마세요.`;
  } else if(fLevel===3){
    level='warning'; title='근친 주의 — F3';
    detail='공통 조상까지 3대 거리입니다(F3급). 가능하면 다른 조합을 우선 고려하세요.';
  } else {
    level='safe'; title=`먼 혈통 — F${fLevel}`;
    detail=`공통 조상까지 ${fLevel}대 이상 떨어져 있어(F4 이상) 실질적 근친 위험은 낮은 편입니다.`;
  }
  common.sort((a,b)=>Math.min(a.genA,a.genB)-Math.min(b.genA,b.genB));
  return { level, title, detail, common };
}

function levelIcon(level){
  return {danger:'⚠️', warning:'⚠️', caution:'ℹ️', safe:'✅'}[level] || 'ℹ️';
}
function levelLabel(level){
  return {danger:'위험', warning:'주의', caution:'참고', safe:'안전'}[level] || '';
}

function renderBloodlineBanner(entA, entB){
  if(!entA || !entB) return '';
  const r = compareBloodline(entA, entB);
  if(!r) return '';
  let html = `<div class="bloodline-banner ${r.level}">
    <b>${levelIcon(r.level)} [${levelLabel(r.level)}] ${esc(r.title)}</b>
    ${esc(r.detail)}`;
  if(r.common && r.common.length){
    html += `<ul>` + r.common.slice(0,5).map(c=>
      `<li>공통 조상: <b>${esc(c.label)}</b> (${esc(entA.name||entA.morph||'A')}쪽 ${esc(kinshipLabel(c.genA,c.branchA))} / ${esc(entB.name||entB.morph||'B')}쪽 ${esc(kinshipLabel(c.genB,c.branchB))})</li>`
    ).join('') + `</ul>`;
  }
  html += `</div>`;
  return html;
}

function renderTabContent(){
  switch(currentTab){
    case 'dashboard': return renderDashboard();
    case 'individual': return renderIndividualList();
    case 'mating': return renderMatingList();
    case 'egg': return renderEggTab();
    case 'hatchling': return renderHatchlingList();
    case 'sold': return renderSoldTab();
    case 'pedigree': return renderPedigreeTab();
    case 'settings': return renderSettingsTab();
    default: return '';
  }
}

function renderFab(){
  const map = {
    individual:`openIndividualForm(null)`,
    mating:`openMatingForm(null)`,
    hatchling:`openHatchlingForm(null)`
  };
  if(!map[currentTab]) return '';
  return `<button class="fab" onclick="${map[currentTab]}">+</button>`;
}

/* ---------------- dashboard ---------------- */
function renderDashboard(){
  const ind = state.individuals;
  const heldCount = ind.filter(i=>i.status==='보유').length;
  const breedingCount = ind.filter(i=>i.breeding==='예').length;
  const activeMatings = state.matings.filter(m=>normalizeMatingStatus(m.status)==='진행 중');
  const openClutches = state.clutches.filter(c=>!c.actualHatchCount);

  let html = `
    <div class="stat-grid">
      <div class="stat-card"><div class="num">${heldCount}</div><div class="lbl">보유 개체</div></div>
      <div class="stat-card"><div class="num">${breedingCount}</div><div class="lbl">브리딩 개체</div></div>
      <div class="stat-card"><div class="num">${activeMatings.length}</div><div class="lbl">진행 중 메이팅</div></div>
      <div class="stat-card"><div class="num">${openClutches.length}</div><div class="lbl">부화 대기 알</div></div>
    </div>
  `;

  // 다가오는 일정: 산란예정 1주일 이내 메이팅 + 부화예정 1주일 이내 알 (지난 것도 포함해서 놓친 거 챙기기)
  const alerts = [];
  activeMatings.forEach(m=>{
    const dday = matingDdayInfo(m);
    if(dday.mode==='predicted' && dday.diff<=7){
      alerts.push({
        type:'mating', diff:dday.diff, date:dday.date,
        title:`${m.damName} × ${m.sireName}`,
        sub:`${nextClutchNum(m)}차 산란예정`
      });
    }
  });
  openClutches.forEach(c=>{
    const pred = predictHatchDates(c.layDate, c.incubationTemp||DEFAULT_INCUBATION_TEMP);
    if(pred.avgDate){
      const diff = daysBetween(todayISO(), pred.avgDate);
      if(diff<=7){
        alerts.push({
          type:'egg', diff, date:pred.avgDate,
          title:`${c.damName} × ${c.sireName}`,
          sub:`${c.clutchNum}차 알 부화예정`
        });
      }
    }
  });
  alerts.sort((a,b)=>a.diff-b.diff);

  html += `<div class="section-head"><h2>다가오는 일정</h2></div>`;
  if(alerts.length===0){
    html += `<div class="empty-state"><div class="dotrow"><span></span><span></span><span></span><span></span><span></span></div><p>1주일 안에 예정된 산란·부화가 없어요.</p></div>`;
  } else {
    alerts.forEach(a=>{
      const overdue = a.diff<0;
      const level = overdue ? 'danger' : (a.diff<=3 ? 'warning' : 'safe');
      const icon = a.type==='mating' ? '💞' : '🥚';
      const targetTab = a.type==='mating' ? 'mating' : 'egg';
      html += `<div class="alert-card ${level}" onclick="switchTab('${targetTab}')" style="cursor:pointer;">
        <div class="icon">${icon}</div>
        <div class="body"><b>${esc(a.title)} — ${esc(a.sub)}</b><span>${fmtKo(a.date)} (${formatDday(a.diff)})</span></div>
      </div>`;
    });
  }

  html += `<div class="disclaimer">부화·산란 예정일은 등록된 정보를 기준으로 계산한 참고용 결과입니다.</div>`;
  return html;
}

function setIndividualFilter(v){ listFilters.individual = v; updateIndividualListBody(); }

function getFilteredIndividuals(){
  const q = listFilters.individual.trim().toLowerCase();
  let items = state.individuals.slice().sort(INDIVIDUAL_SORTERS[individualSort] || INDIVIDUAL_SORTERS.age_desc);
  if(q){
    items = items.filter(i=>(i.name||'').toLowerCase().includes(q)||(i.id||'').toLowerCase().includes(q)||(i.morph||'').toLowerCase().includes(q));
  }
  if(individualMorphFilter){
    items = items.filter(i=>i.morph===individualMorphFilter);
  }
  return items;
}
function updateIndividualListBody(){
  const items = getFilteredIndividuals();
  const body = document.getElementById('individual-list-body');
  if(body) body.innerHTML = renderIndividualListBody(items);
  const count = document.getElementById('individual-count');
  if(count) count.textContent = `${items.length} / ${state.individuals.length}마리`;
}

  if(photo) return `<img src="${photo.dataUrl}" class="card-avatar">`;
  return `<div class="card-avatar-placeholder">🦎</div>`;
}

/* ---------------- 개체 사진(최대 3장, 대표 사진 지정) ---------------- */
let formPhotoState = { photos: [], primaryId: null };

function initPhotoState(photos, primaryId){
  const list = (photos||[]).map(p=>({id:p.id, dataUrl:p.dataUrl}));
  formPhotoState = { photos: list, primaryId: primaryId || (list[0] ? list[0].id : null) };
}

function compressImageFile(file, maxDim, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w>=h){ if(w>maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else { if(h>maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhotoFileSelect(inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file) return;
  if(formPhotoState.photos.length>=3){ inputEl.value=''; return; }
  let dataUrl;
  try{
    dataUrl = await compressImageFile(file, 480, 0.75);
  }catch(e){
    console.error('사진 처리 실패', e);
    inputEl.value='';
    return;
  }
  const id = 'p'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  formPhotoState.photos.push({id, dataUrl});
  if(!formPhotoState.primaryId) formPhotoState.primaryId = id;
  inputEl.value = '';
  renderPhotoStrip();
}
function removePhoto(id){
  formPhotoState.photos = formPhotoState.photos.filter(p=>p.id!==id);
  if(formPhotoState.primaryId===id){
    formPhotoState.primaryId = formPhotoState.photos.length ? formPhotoState.photos[0].id : null;
  }
  renderPhotoStrip();
}
function setPrimaryPhoto(id){
  formPhotoState.primaryId = id;
  renderPhotoStrip();
}
function renderPhotoStrip(){
  const box = document.getElementById('photo-strip');
  if(!box) return;
  let html = `<div class="photo-row">`;
  formPhotoState.photos.forEach(p=>{
    const isPrimary = p.id===formPhotoState.primaryId;
    html += `<div class="photo-thumb-wrap">
      <img src="${p.dataUrl}" class="photo-thumb ${isPrimary?'is-primary':''}">
      <button type="button" class="photo-star ${isPrimary?'active':''}" onclick="setPrimaryPhoto('${p.id}')" title="대표 사진으로 지정">★</button>
      <button type="button" class="photo-remove" onclick="removePhoto('${p.id}')" title="삭제">×</button>
    </div>`;
  });
  if(formPhotoState.photos.length<3){
    html += `<label class="photo-add">+<input type="file" accept="image/*" style="display:none;" onchange="handlePhotoFileSelect(this)"></label>`;
  }
  html += `</div><div class="readonly-note" style="margin-top:6px;">최대 3장 · ★을 눌러 대표 사진(프로필용)을 지정하세요.</div>`;
  box.innerHTML = html;
}


function buildIndividualOptionsByGender(gender, selectedId){
  let html = `<option value="">직접 입력(미등록/외부)</option>`;
  state.individuals.filter(i=>i.gender===gender).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko')).forEach(i=>{
    html += `<option value="${i.id}" ${i.id===selectedId?'selected':''}>${esc(i.name)} (${esc(i.id)})</option>`;
  });
  return html;
}

function setMorphSelectValue(prefix, morphValue){
  const sel = document.getElementById(prefix+'MorphSelect');
  const custom = document.getElementById(prefix+'MorphCustom');
  if(!sel) return;
  if(!morphValue){ sel.value=''; if(custom){custom.style.display='none'; custom.value='';} return; }
  const hasOption = Array.from(sel.options).some(o=>o.value===morphValue);
  if(hasOption){
    sel.value = morphValue;
    if(custom){ custom.style.display='none'; }
  } else {
    // 목록에 없는 값이면 select에 임시 옵션을 추가해 보존
    const opt = document.createElement('option');
    opt.value = morphValue; opt.textContent = morphValue+' (기존 입력값)';
    sel.insertBefore(opt, sel.firstChild.nextSibling);
    sel.value = morphValue;
    if(custom){ custom.style.display='none'; }
  }
}
function setHetSelectValue(prefix, hetValue){
  const sel = document.getElementById(prefix+'HetSelect');
  const custom = document.getElementById(prefix+'HetCustom');
  if(!sel) return;
  const val = hetValue || '';
  const hasOption = Array.from(sel.options).some(o=>o.value===val);
  if(hasOption){ sel.value = val; if(custom) custom.style.display='none'; }
  else {
    const opt = document.createElement('option');
    opt.value = val; opt.textContent = val+' (기존 입력값)';
    sel.appendChild(opt);
    sel.value = val;
    if(custom) custom.style.display='none';
  }
}

function onParentLinkChange(side){
  const sel = document.getElementById(side+'LinkSelect');
  const val = sel.value;
  const idField = document.getElementById(side+'IdField');
  const nameField = document.getElementById(side+'NameField');
  const hatchField = document.getElementById(side+'HatchDateField');
  const companyField = document.getElementById(side+'CompanyField');
  if(val){
    const ind = state.individuals.find(i=>i.id===val);
    if(ind){
      idField.value = ind.id;
      nameField.value = ind.name||'';
      hatchField.value = ind.hatchDate||'';
      companyField.value = ind.originCompany||'';
      setMorphSelectValue(side, ind.morph||'');
      setHetSelectValue(side, ind.morphHet||'');
      setChipGroupValue(side+'Patterns', ind.morphPatterns||[], PATTERN_TRAITS);
      setChipGroupValue(side+'Colors', ind.morphColors||[], COLOR_TRAITS);
    }
  } else {
    idField.value = '';
  }
  updateParentBloodlineCheck();
}

function updateParentBloodlineCheck(){
  const box = document.getElementById('parent-bloodline-check');
  if(!box) return;
  const sireId = document.getElementById('sireIdField').value;
  const damId = document.getElementById('damIdField').value;

    const sire = state.individuals.find(i=>i.id===sireId);
    const dam = state.individuals.find(i=>i.id===damId);
    if(sire && dam){ box.innerHTML = renderBloodlineBanner(dam, sire); return; }
  }
  box.innerHTML = '';
}

   메이팅(mating) 목록 · 아코디언 상세 · 메이팅 기록 · 메이팅 정보 폼
===================================================================== */

function buildIndividualSelectOptions(gender, selectedId){
  let html = `<option value="">선택 안 함</option>`;
  state.individuals.filter(i=>i.gender===gender).sort((a,b)=>(a.name||'').localeCompare(b.name||'','ko')).forEach(i=>{
    html += `<option value="${i.id}" ${i.id===selectedId?'selected':''}>${esc(i.name)} (${esc(i.id)})</option>`;
  });
  return html;
}

function toggleMatingExpand(id){
  if(expandedMatings.has(id)) expandedMatings.delete(id);
  else expandedMatings.add(id);
  updateMatingListBody();
}
function setMatingFilter(v){ listFilters.mating = v; updateMatingListBody(); }
let showEndedMatings = false;
function toggleShowEndedMatings(){ showEndedMatings = !showEndedMatings; updateMatingListBody(); updateMatingListControls(); }

function getFilteredMatings(){
  const q = listFilters.mating.trim().toLowerCase();
  let items = state.matings.slice().sort((a,b)=>{
    const av = latestMatingDate(a)||''; const bv = latestMatingDate(b)||'';
    return bv.localeCompare(av);
  });
  if(!showEndedMatings){
    items = items.filter(m=>normalizeMatingStatus(m.status)!=='산란 종료');
  }
  if(q){
    items = items.filter(m=>(m.damName||'').toLowerCase().includes(q)||(m.sireName||'').toLowerCase().includes(q)||(m.id||'').toLowerCase().includes(q));
  }
  return items;
}
function updateMatingListBody(){
  const items = getFilteredMatings();
  const body = document.getElementById('mating-list-body');
  if(body) body.innerHTML = renderMatingListBody(items);
}
function updateMatingListControls(){
  const btn = document.getElementById('mating-ended-toggle');
  if(!btn) return;
  btn.className = 'chip-toggle' + (showEndedMatings ? ' chip-selected' : '');
  btn.textContent = showEndedMatings ? '종료 같이 보는 중 ✓' : '종료 같이 보기';
}
function renderMatingListBody(items){
  if(items.length===0){
    const endedCount = state.matings.filter(m=>normalizeMatingStatus(m.status)==='산란 종료').length;
    return `<div class="empty-state"><p>${!showEndedMatings && endedCount>0 ? '진행 중인 메이팅이 없어요. 종료된 메이팅 '+endedCount+'건이 숨겨져 있어요.' : '등록된 메이팅이 없어요.'}</p></div>`;
  }
  return items.map(m=>renderMatingCard(m)).join('');
}

function renderMatingList(){
  const items = getFilteredMatings();
  const endedCount = state.matings.filter(m=>normalizeMatingStatus(m.status)==='산란 종료').length;
  return `<div class="section-head"><h2>메이팅 관리</h2><span class="count">${state.matings.length}쌍</span></div>
    <div class="searchbar"><input placeholder="암컷·수컷 이름으로 검색" value="${esc(listFilters.mating)}" oninput="setMatingFilter(this.value)"></div>
    ${endedCount>0?`<div class="searchbar"><button type="button" id="mating-ended-toggle" class="chip-toggle${showEndedMatings?' chip-selected':''}" onclick="toggleShowEndedMatings()">${showEndedMatings?'종료 같이 보는 중 ✓':'종료 같이 보기'}</button></div>`:''}
    <div id="mating-list-body">${renderMatingListBody(items)}</div>`;
}

function renderMatingCard(m){
  const dam = state.individuals.find(i=>i.id===m.damId);
  const sire = state.individuals.find(i=>i.id===m.sireId);
  let riskChip = '';
  if(dam && sire){
    const r = compareBloodline(dam, sire);
    if(r.level==='danger') riskChip = `<span class="chip danger">혈통 위험</span>`;
    else if(r.level==='warning') riskChip = `<span class="chip alt">혈통 주의</span>`;
  }
  const lastMate = latestMatingDate(m);
  const nextNum = nextClutchNum(m);
  const dday = matingDdayInfo(m);
  const cs = clutchesOfMating(m.id);
  const expanded = expandedMatings.has(m.id);
  const statusNorm = normalizeMatingStatus(m.status);

  let ddayLabel, ddayValue;
  if(dday.mode==='ended'){ ddayLabel='산란 종료'; ddayValue='종료'; }
  else if(dday.mode==='waiting'){ ddayLabel='메이팅 후 경과'; ddayValue=`D+${dday.elapsed}`; }
  else if(dday.mode==='predicted'){ ddayLabel=`${nextNum}차 산란예정일`; ddayValue=`${fmtKo(dday.date)} (${formatDday(dday.diff)})`; }
  else { ddayLabel=`${nextNum}차 산란예정일`; ddayValue='-'; }

  let detail = '';
  if(expanded){
    let rows = '';
    if(cs.length===0){
      rows = `<div class="readonly-note" style="margin:6px 0 10px;">아직 기록된 알이 없어요.</div>`;
    } else {
      cs.forEach(c=>{
        const pred = predictHatchDates(c.layDate, c.incubationTemp||m.incubationTemp||DEFAULT_INCUBATION_TEMP);
        rows += `<div class="clutch-row" onclick="openClutchForm('${c.id}', '${m.id}')">
          <div class="cnum">${esc(c.clutchNum)}차</div>
          <div class="cmid">
            <span class="egg-mini">
              <span class="dot ${c.egg1Status==='유정'?'fertile':'infertile'}"></span>
              <span class="dot ${c.egg2Status==='유정'?'fertile':'infertile'}"></span>
            </span>
            &nbsp;${esc(c.layDate)||'-'}
          </div>
          <div class="cright">${c.actualHatchCount?('해칭 '+c.actualHatchCount):(pred.avgDate?('예정 '+fmtKo(pred.avgDate)):'-')}</div>
        </div>`;
      });
    }
    const logDates = (m.matingLog||[]).slice().sort();
    detail = `<div class="mating-detail">
      ${rows}
      <div class="mating-actions">
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openClutchForm(null, '${m.id}')">+ 알 기록 추가</button>
        <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation(); openMatingForm('${m.id}')">메이팅 정보 수정</button>
      </div>
      ${logDates.length?`<div class="mating-log">메이팅 기록: ${logDates.map(d=>esc(d)).join(' · ')}</div>`:''}
    </div>`;
  }

  return `<div class="mating-card">
    <div class="mating-head" onclick="toggleMatingExpand('${m.id}')">
      <div class="card-top">
        <div><div class="card-title">${esc(m.damName)} × ${esc(m.sireName)}</div><div class="card-id">${esc(m.id)}</div></div>
        <button class="chip ${statusNorm==='진행 중'?'':'muted'}" style="border:none;cursor:pointer;font-family:inherit;" onclick="event.stopPropagation(); toggleMatingStatus('${m.id}')">${statusNorm}</button>
      </div>
      <div class="card-meta">${riskChip}</div>
      <div class="card-datarow">
        <div class="dcell"><div class="lbl">최근 메이팅일</div><div class="val">${lastMate?esc(lastMate):'-'}</div></div>
        <div class="dcell"><div class="lbl">${ddayLabel}</div><div class="val">${ddayValue}</div></div>
        <div class="dcell"><div class="lbl">누적 클러치</div><div class="val">${cs.length}건</div></div>
      </div>
    </div>
    ${detail}
  </div>`;
}

function updateClutchHatchPreview(){
  const layInput = document.querySelector('#clutch-form [name="layDate"]');
  const tempInput = document.querySelector('#clutch-form [name="incubationTemp"]');
  const box = document.getElementById('clutch-hatch-preview');
  if(!layInput || !tempInput || !box) return;
  const lay = layInput.value, temp = parseFloat(tempInput.value);
  if(!lay || isNaN(temp)){ box.innerHTML=''; return; }
  const p = predictHatchDates(lay, temp);
  let html = '';
  if(p.danger){
    html += `<div class="bloodline-banner danger" style="margin-bottom:8px;">⚠️ ${temp}°C는 안전 범위(${MIN_SAFE_TEMP}~${MAX_SAFE_TEMP}°C) 밖이에요.</div>`;
  }
  html += `<div class="readonly-note" style="font-size:12.5px;">예상 부화일 — 최단 <b>${p.minDate?fmtKo(p.minDate):'-'}</b> · 평균 <b>${p.avgDate?fmtKo(p.avgDate):'-'}</b> · 최장 <b>${p.maxDate?fmtKo(p.maxDate):'-'}</b></div>`;
  box.innerHTML = html;
}

async function saveClutch(id, matingId){
  const form = document.getElementById('clutch-form');
  const fd = new FormData(form);
  const obj = {};
  fd.forEach((v,k)=>obj[k]=v);
  if(id){
    const item = state.clutches.find(c=>c.id===id);
    Object.assign(item, obj);
  } else {
    const mating = state.matings.find(m=>m.id===matingId);
    obj.matingId = matingId;
    obj.damId = mating?mating.damId:''; obj.damName = mating?mating.damName:'';
    obj.sireId = mating?mating.sireId:''; obj.sireName = mating?mating.sireName:'';
    const yy = currentYY();
    obj.id = nextEntityId('HCC-C'+yy+'-', state.clutches, 3);
    state.clutches.push(obj);
  }
  closeModal();
  await persistAndRender();
}

async function deleteClutch(id){

let expandedEggGroups = new Set();
function toggleEggGroup(matingId){
  if(expandedEggGroups.has(matingId)) expandedEggGroups.delete(matingId);
  else expandedEggGroups.add(matingId);
  renderMainOnly();
}
function setEggGroupSort(v){ eggGroupSort = v; renderMainOnly(); }
let showEndedEggGroups = false;
function toggleShowEndedEggGroups(){ showEndedEggGroups = !showEndedEggGroups; renderMainOnly(); }

/* 이 페어의 알이 전부(무정 제외) 해칭 완료됐는지: 유정란인데 아직 연결된 해칭개체가 없는 게 하나라도 있으면 false */
function isEggGroupFullyDone(clutches){
  for(const c of clutches){
    for(const [field,label] of [['egg1Status','A'],['egg2Status','B']]){
      const st = c[field];
      if(st==='없음') continue;
      if(st==='유정' && !hatchlingForEgg(c.id, label)) return false;
    }
  }
  return true;
}

function renderEggTab(){
  const avgTemp = avgIncubationTemp();
  const avgDays = avgActualIncubationDays();

  let html = `<div class="section-head"><h2>산란·알</h2></div>
  <div class="section-sub">페어를 누르면 그 페어가 낳은 알 전체가 보여요. 부화한 알은 초록, 부화 대기 중인 알은 경과일이 카운트되고, 무정란은 회색으로 표시돼요.</div>
  <div class="stat-grid">
    <div class="stat-card"><div class="num">${avgTemp!==null?avgTemp.toFixed(1)+'°C':'-'}</div><div class="lbl">우리집 평균 인큐 온도</div></div>
    <div class="stat-card"><div class="num">${avgDays!==null?Math.round(avgDays)+'일':'-'}</div><div class="lbl">우리집 알 평균 부화일수</div></div>
  </div>`;

  const matingIds = [...new Set(state.clutches.map(c=>c.matingId).filter(Boolean))];

    return html;
  }

  let groups = matingIds.map(mid=>{
    const mating = state.matings.find(m=>m.id===mid);
    const cs = clutchesOfMating(mid);
    return { matingId:mid, mating, clutches:cs, lastMate: mating?latestMatingDate(mating):null, done:isEggGroupFullyDone(cs) };
  }).filter(g=>g.clutches.length>0);

  const endedCount = groups.filter(g=>g.done).length;
  if(!showEndedEggGroups){
    groups = groups.filter(g=>!g.done);
  }

  groups.sort((a,b)=>{
    const av=a.lastMate||'', bv=b.lastMate||'';
    return eggGroupSort==='recent' ? bv.localeCompare(av) : av.localeCompare(bv);
  });

  html += `<div class="section-head" style="margin-top:18px;">
    <h2 style="font-size:15px;">페어 목록</h2>
    <select onchange="setEggGroupSort(this.value)" style="border:1px solid var(--border);border-radius:var(--radius-sm);padding:6px 10px;font-size:12.5px;background:var(--surface);color:var(--ink-soft);">
      <option value="recent" ${eggGroupSort==='recent'?'selected':''}>메이팅 최신순</option>
      <option value="old" ${eggGroupSort==='old'?'selected':''}>메이팅 오래된순</option>
    </select>

  if(endedCount>0){
    html += `<div class="searchbar" style="margin-top:-6px;"><button type="button" class="chip-toggle${showEndedEggGroups?' chip-selected':''}" onclick="toggleShowEndedEggGroups()">${showEndedEggGroups?'종료 같이 보는 중 ✓':'종료 같이 보기 ('+endedCount+'쌍 숨김)'}</button></div>`;
  }

  if(groups.length===0){
    html += `<div class="empty-state" style="margin-top:12px;"><p>${endedCount>0?'전부 부화 완료돼서 숨겨져 있어요. 위 버튼으로 같이 볼 수 있어요.':'표시할 페어가 없어요.'}</p></div>`;
  } else {
    groups.forEach(g=>{
      html += renderEggGroupCard(g);
    });
  }

  return html;
}

function renderEggGroupCard(g){
  const { matingId, mating, clutches:cs, lastMate } = g;
  const expanded = expandedEggGroups.has(matingId);
  const damName = cs[0].damName, sireName = cs[0].sireName;
  const openCount = cs.filter(c=>!c.actualHatchCount).length;

  let detail = '';
  if(expanded){
    const sorted = cs.slice().sort((a,b)=>(a.layDate||'').localeCompare(b.layDate||''));
    let eggsHtml = '';
    sorted.forEach(c=>{
      [['egg1Status','A',1],['egg2Status','B',2]].forEach(([field,label,num])=>{
        const st = c[field];
        if(st==='없음') return;
        const fertile = st==='유정';
        const hatchling = fertile ? hatchlingForEgg(c.id, label) : null;
        const days = c.layDate ? daysBetween(c.layDate, todayISO()) : null;
        const pred = predictHatchDays(c.incubationTemp||DEFAULT_INCUBATION_TEMP);
        const overdue = !hatchling && fertile && pred.max!==null && days!==null && days>pred.max;
        let cls, num2, lbl2;
        if(!fertile){ cls='infertile'; num2='×'; lbl2='무정'; }
        else if(hatchling){ cls='hatched'; num2=hatchling.incubationDays||'✓'; lbl2='완료'; }
        else if(overdue){ cls='overdue'; num2=days; lbl2='D+'; }
        else { cls='fertile'; num2=days!==null?days:'-'; lbl2='D+'; }
        eggsHtml += `<div class="egg ${cls}" onclick="openEggDetail('${c.id}', ${num})">
          <span class="cnum-badge">${esc(c.clutchNum)}차</span>
          <div class="num">${num2}</div>
          <div class="lbl">${lbl2}</div>
        </div>`;
      });
    });
    detail = `<div class="mating-detail"><div class="egg-row">${eggsHtml}</div></div>`;
  }

  return `<div class="mating-card">
    <div class="mating-head" onclick="toggleEggGroup('${matingId}')">
      <div class="card-top">
        <div><div class="card-title">${esc(damName)} × ${esc(sireName)}</div><div class="card-id">최근 메이팅일 ${lastMate?esc(lastMate):'-'}</div></div>
        <div class="chip ${openCount>0?'alt':''}">${openCount>0?(openCount+'건 대기'):'모두 해칭'}</div>
      </div>
      <div class="card-meta"><span class="chip muted">누적 ${cs.length}클러치</span></div>
    </div>
    ${detail}
  </div>`;
}

function renderPedigreeTree(ent, label){
  const lines = [];
  function walk(e, gen, prefix){
    if(gen>3) return;
    ['sire','dam'].forEach(side=>{
      const ref = parentRef(e, side);
      const sideLabel = side==='sire' ? '부' : '모';
      if(!ref){
        return;
      }
      const name = e[side+'Name'] || '?';
      const linked = ref.type==='linked';
      lines.push(`${'&nbsp;'.repeat(prefix*3)}└ ${sideLabel}: <b>${esc(name)}</b> ${linked?'(등록 개체)':'(이름만 등록)'}`);
      if(linked){
        const nextInd = state.individuals.find(i=>i.id===ref.id);
        if(nextInd) walk(nextInd, gen+1, prefix+1);
      }
    });
  }
  walk(ent, 0, 0);
  if(lines.length===0){
    lines.push('등록된 부모 정보가 없습니다.');
  }
  return `<div class="tree-box"><b>${esc(label)}의 계보</b><br>${lines.join('<br>')}</div>`;
}

function updateHatchIncubationCalc(){
  const layEl = document.getElementById('hatchLayDateField');
  const hatchEl = document.getElementById('hatchHatchDateField');
  const daysEl = document.getElementById('hatchIncubationDaysField');
  if(!layEl || !hatchEl || !daysEl) return;
  if(layEl.value && hatchEl.value){
    const d = daysBetween(layEl.value, hatchEl.value);
    daysEl.value = d>=0 ? d : '';
  } else {
    daysEl.value = '';
  }
}

async function saveHatchling(id){
  const form = document.getElementById('hatchling-form');
  const fd = new FormData(form);
  const obj = {};
  fd.forEach((v,k)=>obj[k]=v);
  obj.morph = readMorphValue('hatch');
  obj.morphHet = readHetValue('hatch');
  obj.morphPatterns = readChipGroup('hatchPatterns');
  obj.morphColors = readChipGroup('hatchColors');
  obj.photos = formPhotoState.photos;
  obj.primaryPhotoId = formPhotoState.primaryId;
  obj.salePlatform = readSalePlatformValue('hatch');
  if(id){
    const item = state.hatchlings.find(h=>h.id===id);
    Object.assign(item, obj);
  } else {
    const yy = currentYY();
    obj.id = nextEntityId('HCC-H'+yy+'-', state.hatchlings, 4);
    obj.promotedToId = null;
    state.hatchlings.push(obj);
  }
  syncClutchHatchCount(obj.clutchId, true);
  closeModal();
  await persistAndRender();
}

/* 이 클러치에 실제 연결된 해칭개체 수만큼 실제 해칭 수를 자동으로 맞춰준다.
   bumpOnly=true면 기존 수동 입력값보다 늘어날 때만 반영(과거 수기 입력 보존),
   false면(삭제 시) 정확히 다시 계산해서 반영한다. */
function syncClutchHatchCount(clutchId, bumpOnly){
  if(!clutchId) return;
  const c = state.clutches.find(x=>x.id===clutchId);
  if(!c) return;
  const linkedCount = state.hatchlings.filter(h=>h.clutchId===clutchId).length;
  if(bumpOnly){
    const current = parseInt(c.actualHatchCount,10) || 0;
    if(linkedCount>current) c.actualHatchCount = linkedCount;
  } else {
    c.actualHatchCount = linkedCount;
  }
}

async function deleteHatchling(id){

  state.hatchlings = state.hatchlings.filter(h=>h.id!==id);

  await persistAndRender();
}

/* =====================================================================
   실시간 동기화 (Firebase Firestore, 선택 사항)
   - 설정 안 하면 지금처럼 이 기기(localStorage)에만 저장됨 (기본값)
   - 설정하면 같은 설정을 넣은 기기끼리 실시간으로 같은 데이터를 공유함
===================================================================== */

const FIREBASE_CONFIG_KEY = 'hotchoco_firebase_config_v1';
const SYNC_DOC_PATH = ['hotchoco_shared', 'state'];

let syncStatus = 'local'; // 'local' | 'connecting' | 'synced' | 'error'
let firestoreDb = null;
let suppressNextSnapshot = false;
let firstSnapshotResolved = null; // resolve fn for the init-time wait

function getFirebaseConfig(){
  try{
    const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
    return raw ? JSON.parse(raw) : null;
  }catch(e){ return null; }
}
function saveFirebaseConfig(cfg){
  try{ localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(cfg)); }catch(e){}
}
function clearFirebaseConfig(){
  try{ localStorage.removeItem(FIREBASE_CONFIG_KEY); }catch(e){}
}

function loadScriptOnce(src){
  return new Promise((resolve, reject)=>{
    if(document.querySelector(`script[src="${src}"]`)){ resolve(); return; }
    const s = document.createElement('script');
    s.src = src;
    s.onload = ()=>resolve();
    s.onerror = ()=>reject(new Error('스크립트 로드 실패: '+src));
    document.head.appendChild(s);
  });
}

async function loadFirebaseSDK(){
  if(window.firebase && window.firebase.firestore) return true;
  try{
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js');
    await loadScriptOnce('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
    return true;
  }catch(e){
    console.error('Firebase SDK 로드 실패', e);
    return false;
  }
}

/* 초기 연결: 설정이 있으면 원격 데이터가 올 때까지(최대 4초) 기다렸다가 render */
function initSync(){
  return new Promise(async (resolve)=>{
    const cfg = getFirebaseConfig();
    if(!cfg){ syncStatus='local'; resolve(); return; }
    syncStatus = 'connecting';
    const ok = await loadFirebaseSDK();
    if(!ok){ syncStatus='error'; resolve(); return; }
    try{
      if(!firebase.apps || firebase.apps.length===0){
        firebase.initializeApp(cfg);
      }
      await firebase.auth().signInAnonymously();
      firestoreDb = firebase.firestore();
      const docRef = firestoreDb.collection(SYNC_DOC_PATH[0]).doc(SYNC_DOC_PATH[1]);

      let resolved = false;
      const timeout = setTimeout(()=>{
        if(!resolved){ resolved = true; resolve(); } // 네트워크 느리면 로컬 데이터로 우선 표시
      }, 4000);

      docRef.onSnapshot(snap=>{
        if(suppressNextSnapshot){ suppressNextSnapshot = false; return; }
        if(snap.exists){
          const remote = snap.data();
          if(remote && remote.json){
            try{
              state = JSON.parse(remote.json);
              syncStatus = 'synced';
            }catch(e){ /* ignore parse error */ }
          }
        } else {
          // 원격에 아직 문서가 없으면 지금 상태를 최초 데이터로 업로드
          pushStateToCloud();
          syncStatus = 'synced';
        }
        if(!resolved){ resolved = true; clearTimeout(timeout); resolve(); }
        else { render(); }
      }, err=>{
        console.error('동기화 오류', err);
        syncStatus = 'error';
        if(!resolved){ resolved = true; clearTimeout(timeout); resolve(); }
        else { render(); }
      });
    }catch(e){
      console.error('Firebase 초기화 실패', e);
      syncStatus = 'error';
      resolve();
    }
  });
}

async function pushStateToCloud(){
  if(!firestoreDb) return;
  try{
    suppressNextSnapshot = true;
    await firestoreDb.collection(SYNC_DOC_PATH[0]).doc(SYNC_DOC_PATH[1])
      .set({ json: JSON.stringify(state), updatedAt: Date.now() });
  }catch(e){
    console.error('클라우드 업로드 실패', e);
    suppressNextSnapshot = false;
  }
}

function getSoldRecords(){

  state.individuals.forEach(i=>{

        kind:'individual', id:i.id, label:i.name||'(이름없음)',
        parents:`${i.sireName||'-'} × ${i.damName||'-'}`,
        hatchDate:i.hatchDate, gender:i.gender,
        salePlatform:i.salePlatform, saleDate:i.saleDate, salePrice:i.salePrice
      });
    }
  });
  state.hatchlings.forEach(h=>{
    if(h.status==='분양 완료'){
      list.push({
        kind:'hatchling', id:h.id, label:h.morph||'모프 미정',
        parents:`${h.sireName||'-'} × ${h.damName||'-'}`,
        hatchDate:h.hatchDate, gender:h.gender,
        salePlatform:h.salePlatform, saleDate:h.saleDate, salePrice:h.price
      });
    }
  });
  list.sort((a,b)=>(b.saleDate||'').localeCompare(a.saleDate||''));
  return list;
}
